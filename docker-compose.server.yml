services:
  redis-7001:
    image: redis:8.2.4-alpine3.22
    container_name: redis-7001
    network_mode: "host"
    command: >
      redis-server
      /usr/local/etc/redis/redis.conf
      --port 7001
      --cluster-announce-ip ${PUBLIC_IP}
      --cluster-announce-port 7001
      --cluster-announce-bus-port 17001
      --requirepass "${REDIS_PASSWORD}"
      --masterauth "${REDIS_PASSWORD}"
    volumes:
      - ./data/7001:/data
      - ./redis-cluster.conf:/usr/local/etc/redis/redis.conf:ro
    restart: unless-stopped

  redis-7002:
    image: redis:8.2.4-alpine3.22
    container_name: redis-7002
    network_mode: "host"
    command: >
      redis-server
      /usr/local/etc/redis/redis.conf
      --port 7002
      --cluster-announce-ip ${PUBLIC_IP}
      --cluster-announce-port 7002
      --cluster-announce-bus-port 17002
      --requirepass "${REDIS_PASSWORD}"
      --masterauth "${REDIS_PASSWORD}"
    volumes:
      - ./data/7002:/data
      - ./redis-cluster.conf:/usr/local/etc/redis/redis.conf:ro
    restart: unless-stopped

  redis-7003:
    image: redis:8.2.4-alpine3.22
    container_name: redis-7003
    network_mode: "host"
    command: >
      redis-server
      /usr/local/etc/redis/redis.conf
      --port 7003
      --cluster-announce-ip ${PUBLIC_IP}
      --cluster-announce-port 7003
      --cluster-announce-bus-port 17003
      --requirepass "${REDIS_PASSWORD}"
      --masterauth "${REDIS_PASSWORD}"
    volumes:
      - ./data/7003:/data
      - ./redis-cluster.conf:/usr/local/etc/redis/redis.conf:ro
    restart: unless-stopped

  redis-7004:
    image: redis:8.2.4-alpine3.22
    container_name: redis-7004
    network_mode: "host"
    command: >
      redis-server
      /usr/local/etc/redis/redis.conf
      --port 7004
      --cluster-announce-ip ${PUBLIC_IP}
      --cluster-announce-port 7004
      --cluster-announce-bus-port 17004
      --requirepass "${REDIS_PASSWORD}"
      --masterauth "${REDIS_PASSWORD}"
    volumes:
      - ./data/7004:/data
      - ./redis-cluster.conf:/usr/local/etc/redis/redis.conf:ro
    restart: unless-stopped

  redis-7005:
    image: redis:8.2.4-alpine3.22
    container_name: redis-7005
    network_mode: "host"
    command: >
      redis-server
      /usr/local/etc/redis/redis.conf
      --port 7005
      --cluster-announce-ip ${PUBLIC_IP}
      --cluster-announce-port 7005
      --cluster-announce-bus-port 17005
      --requirepass "${REDIS_PASSWORD}"
      --masterauth "${REDIS_PASSWORD}"
    volumes:
      - ./data/7005:/data
      - ./redis-cluster.conf:/usr/local/etc/redis/redis.conf:ro
    restart: unless-stopped

  redis-7006:
    image: redis:8.2.4-alpine3.22
    container_name: redis-7006
    network_mode: "host"
    command: >
      redis-server
      /usr/local/etc/redis/redis.conf
      --port 7006
      --cluster-announce-ip ${PUBLIC_IP}
      --cluster-announce-port 7006
      --cluster-announce-bus-port 17006
      --requirepass "${REDIS_PASSWORD}"
      --masterauth "${REDIS_PASSWORD}"
    volumes:
      - ./data/7006:/data
      - ./redis-cluster.conf:/usr/local/etc/redis/redis.conf:ro
    restart: unless-stopped

  redis-cluster-init:
    image: redis:8.2.4-alpine3.22
    container_name: redis-cluster-init
    network_mode: "host"
    depends_on:
      - redis-7001
      - redis-7002
      - redis-7003
      - redis-7004
      - redis-7005
      - redis-7006
    entrypoint: ["/bin/sh", "-c"]
    command: >
      until redis-cli -a "${REDIS_PASSWORD}" -h 127.0.0.1 -p 7001 ping;
      do sleep 2; done;
      if ! redis-cli -a "${REDIS_PASSWORD}" -h 127.0.0.1 -p 7001 cluster info
      | grep -q 'cluster_state:ok'; then
        redis-cli -a "${REDIS_PASSWORD}" --cluster create
        ${PUBLIC_IP}:7001
        ${PUBLIC_IP}:7002
        ${PUBLIC_IP}:7003
        ${PUBLIC_IP}:7004
        ${PUBLIC_IP}:7005
        ${PUBLIC_IP}:7006
        --cluster-replicas 1 --cluster-yes;
      fi
    restart: "no"
