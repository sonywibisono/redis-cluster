# Autentikasi dikonfigurasi melalui CLI flags (--requirepass & --masterauth)
# di docker-compose agar dapat membaca variabel .env secara dinamis.
# Binding IP address
bind 0.0.0.0
protected-mode no

cluster-enabled yes
cluster-config-file nodes.conf
cluster-node-timeout 5000

appendfsync everysec                                                                                                      
no-appendfsync-on-rewrite yes

appendonly yes
dir /data

# Maksimum memori contoh; sesuaikan kapasitas server
maxmemory 512mb
maxmemory-policy noeviction

io-threads 4                                                                                                              
io-threads-do-reads yes
